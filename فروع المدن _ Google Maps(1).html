<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>فروع المدن | Google Maps</title>
    <style>
      :root {
        --bg: #002fbd;
        --bg-deep: #001f85;
        --card: rgba(255, 255, 255, 0.1);
        --card-hover: rgba(255, 255, 255, 0.2);
        --border: rgba(255, 255, 255, 0.22);
        --text: #ffffff;
        --muted: #bcd2ff;
        --accent: #2785ff;
        --accent-soft: #8fc0ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(circle at 85% -10%, #2f6bff 0, transparent 42%),
          radial-gradient(circle at 10% 110%, #0a45e6 0, transparent 40%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        background-attachment: fixed;
        font-family: Tahoma, Arial, sans-serif;
      }
      .page {
        width: min(920px, calc(100% - 32px));
        margin: auto;
        padding: 24px 0 32px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }
      .header { text-align: center; margin-bottom: 34px; }
      .badge {
        width: min(300px, 78%);
        margin: 0 auto 14px;
      }
      .badge img { width: 100%; height: auto; display: block; }
      h1 {
        margin: 0 0 8px; font-size: clamp(24px, 5vw, 34px);
        display: flex; align-items: center; justify-content: center; gap: 10px;
      }
      h1 svg { width: 1.1em; height: 1.1em; flex: 0 0 auto; }
      .line {
        width: 70px; height: 4px; margin: 16px auto 0;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--accent), #fff);
      }
      .branches {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .branch {
        display: flex; align-items: center; gap: 14px;
        min-height: 88px; padding: 16px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        text-decoration: none;
        backdrop-filter: blur(6px);
        transition: 0.2s ease;
      }
      .branch:hover, .branch:active {
        background: var(--card-hover);
        border-color: #fff;
        transform: translateY(-3px);
        box-shadow: 0 14px 30px rgba(0, 10, 90, 0.45);
      }
      .pin {
        flex: 0 0 auto; width: 46px; height: 46px;
        border-radius: 14px;
        display: grid; place-items: center;
        color: var(--bg);
        background: #fff;
      }
      .pin svg { width: 22px; height: 22px; }
      .branch-content { min-width: 0; flex: 1; }
      .branch-name {
        display: block; font-size: 16px; font-weight: bold;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .branch-meta { display: block; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
      .arrow { color: var(--accent-soft); font-size: 24px; line-height: 1; }
      .empty { display: none; }
      @media (min-width: 621px) {
        .branch:last-child:nth-child(odd) {
          grid-column: 1 / -1;
          justify-self: center;
          width: calc(50% - 7px);
        }
      }
      @media (min-width: 900px) {
        .badge { width: 460px; margin-bottom: 22px; }
      }
      @media (max-width: 620px) {
        .page { width: min(100% - 22px, 520px); padding-top: 36px; }
        .branches { grid-template-columns: 1fr; gap: 10px; }
      }
    </style>
  </head>
